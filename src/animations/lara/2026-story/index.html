<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Uma história para a Lara ✨</title>
  <link rel="stylesheet" href="styles/default.css?v=40">
  <script src="vendor/p5.min.js"></script>
  <script src="js/engine.js?v=42"></script>
  <script src="js/story.js?v=42"></script>
  <script src="js/main.js?v=42"></script>
</head>
<body>
  <!-- Ecrã inicial (desbloqueia o áudio no primeiro toque) -->
  <div id="start" class="start">
    <div class="start-inner">
      <p class="eyebrow">Uma história para a</p>
      <h1 class="title">Lara</h1>
      <button id="startBtn" class="begin">Começar ✨</button>
      <div class="toggles">
        <label><input type="checkbox" id="calm"> Modo calmo</label>
        <label><input type="checkbox" id="sound" checked> Som</label>
      </div>
      <p class="hint">Toca no ecrã para avançares a história</p>
    </div>
  </div>

  <!-- Controlos discretos durante a história -->
  <div id="hud" class="hud hidden">
    <button id="slideBtn" class="ctl" title="Ver as fotos em grande" aria-label="Ver as fotos em grande" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5L5 20"/></svg>
    </button>
    <button id="replayBtn" class="ctl" title="Recomeçar" aria-label="Recomeçar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 3v4.5h4.5"/></svg>
    </button>
  </div>
</body>
</html>
